# 宝塔面板 Nginx 伪静态配置
# 使用方法：宝塔面板 → 网站 → 你的站点 → 设置 → 伪静态 → 粘贴以下内容

location /data/ {
    deny all;
}

location /api/ {
    try_files $uri $uri/ /index.php?$query_string;
}

location /admin {
    try_files $uri $uri/ /index.php?$query_string;
}

location / {
    try_files $uri $uri/ /index.php?$query_string;
}
