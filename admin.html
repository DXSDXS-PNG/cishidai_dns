<!DOCTYPE html>
<html lang="zh-CN">
<!-- 作者D先生微信（二次开发/开通域名违规检测功能/程序定制）：A1565182 -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>DNS二级域名管理系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#edf7ff;--card:#fff;--panel:#fbfdff;--border:#dfe8f1;--line:#e6edf5;--text:#172033;--muted:#697d96;--primary:#2f87ff;--primary-hover:#1673ed;--good:#10a45d;--warn:#a26c00;--bad:#d84a4a;--radius:14px;--shadow:0 14px 32px rgba(77,111,143,.08)}
html,body{touch-action:manipulation}
body{font-family:"Segoe UI","Microsoft YaHei",Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
/* 登录页 */
.login-page{display:flex;align-items:center;justify-content:center;min-height:100vh;background:#eef6ff;padding:24px}
.login-box{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:34px;width:410px;max-width:94vw;box-shadow:0 18px 46px rgba(70,91,117,.12)}
.login-box h1{text-align:center;font-size:24px;margin-bottom:8px;color:#132037}
.login-box h1::first-letter{color:var(--primary)}
.login-box p{text-align:center;color:var(--muted);font-size:14px;margin-bottom:24px}
.login-box label{display:block;margin-bottom:14px;font-size:14px;color:var(--muted);font-weight:700}
.login-box input{display:block;width:100%;height:42px;padding:0 12px;margin-top:7px;background:#fff;border:1px solid #d8e3ef;border-radius:var(--radius);color:var(--text);font-size:14px;outline:none}
.login-box input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(47,135,255,.12)}
.login-box button{width:100%;height:42px;background:var(--primary);color:#fff;border:none;border-radius:var(--radius);font-size:15px;font-weight:800;cursor:pointer;margin-top:8px}
.login-box button:hover{background:var(--primary-hover)}
.login-box .msg{color:var(--bad);font-size:13px;text-align:center;margin-top:12px;min-height:20px}
.login-box .link{text-align:center;margin-top:16px}
.login-box .link a{color:var(--primary);text-decoration:none;font-size:13px}
/* 主布局 */
.app{display:none;min-height:100vh;background:var(--bg)}
.app.show{display:grid;grid-template-columns:280px minmax(0,1fr)}
.app.show.sidebar-collapsed{grid-template-columns:84px minmax(0,1fr)}
.sidebar{position:sticky;top:0;height:100vh;background:linear-gradient(180deg,#fbfdff,#f6fbff);border-right:1px solid #dde9f5;display:flex;flex-direction:column;box-shadow:8px 0 24px rgba(35,84,125,.06)}
.sidebar .logo{height:72px;display:flex;align-items:center;gap:8px;padding:0 16px 0 30px;border-bottom:1px solid #e0e9f2;font-size:20px;font-weight:900}
.sidebar .logo span{color:var(--primary);font-size:18px}
.sidebar-toggle{margin-left:auto;width:34px;height:34px;border:1px solid #d7e2ef;background:#fff;color:#697d96;border-radius:12px;font-size:18px;font-weight:900;cursor:pointer}
.sidebar-toggle:hover{border-color:#9fc8ff;color:#1673ed}
.sidebar-collapsed .sidebar .logo{justify-content:center;padding:0}
.sidebar-collapsed .sidebar .logo strong,.sidebar-collapsed .sidebar .logo span,.sidebar-collapsed .sidebar nav::before,.sidebar-collapsed .sidebar .user-box span{display:none}
.sidebar-collapsed .sidebar-toggle{margin:0}
.sidebar-collapsed .sidebar nav button{justify-content:center;padding:0}
.sidebar-collapsed .sidebar nav button span{display:none}
.sidebar-collapsed .sidebar nav button::after{content:attr(data-short);font-size:18px;font-weight:900}
.sidebar-collapsed .sidebar .user-box{justify-content:center;padding:14px 8px}
.sidebar-collapsed .sidebar .user-box button{padding:0 10px}
.sidebar nav{flex:1;padding:18px 8px;overflow-y:auto}
.sidebar nav::before{content:"管理后台";display:block;margin:0 0 12px;padding:0 6px;color:#8394aa;font-size:14px;font-weight:700}
.sidebar nav button{width:100%;height:56px;border:0;border-radius:16px;background:transparent;display:flex;align-items:center;padding:0 26px;color:#18243a;font-size:17px;font-weight:800;text-align:left;margin-bottom:8px;cursor:pointer}
.sidebar nav button i{display:none}
.sidebar nav button span{font-size:17px}
.sidebar nav button:hover{background:#eef6ff;color:#0f1d33}
.sidebar nav button.active{background:linear-gradient(135deg,#338cff,#82d4ff);color:#fff;box-shadow:0 12px 26px rgba(43,139,255,.24)}
.sidebar nav button.active i{color:#fff}
.sidebar .user-box{padding:14px 16px;border-top:1px solid #e0e9f2;display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:800}
.sidebar .user-box button{height:36px;background:#fff;border:1px solid #d7e2ef;color:#697d96;padding:0 14px;border-radius:18px;cursor:pointer;font-size:13px}
.main{min-width:0;overflow-y:auto;max-height:100vh;padding:0 28px 38px}
.topbar{position:sticky;top:0;z-index:4;height:72px;background:#fff;border-bottom:1px solid #e0e9f2;display:flex;justify-content:space-between;align-items:center;margin:0 -28px 24px;padding:0 28px}
.topbar h2{font-size:22px;line-height:1;color:#1e293b}
.topbar h2::before{content:"首页 / 管理后台 / ";font-size:18px;font-weight:500;color:#8b9bb0}
.topbar .sub{color:var(--muted);font-size:13px;margin-top:7px}
.topbar .actions button{height:38px;padding:0 18px;border-radius:22px;cursor:pointer;font-size:14px;margin-left:8px}
.btn{min-height:36px;padding:0 14px;border-radius:12px;cursor:pointer;font-size:14px;font-weight:800;border:none}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-hover)}
.btn-secondary{background:#fff;color:#54677f;border:1px solid #d7e2ef}
.btn-secondary:hover{border-color:#9fc8ff;color:#1673ed}
.btn-danger{background:var(--bad);color:#fff}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:20px;margin-bottom:20px}
.kpi{height:110px;background:#fff;border:1px solid #e0e8f1;border-radius:20px;padding:20px;box-shadow:var(--shadow)}
.kpi span{display:block;color:#697d96;font-weight:800;margin-bottom:8px}
.kpi strong{font-size:30px;color:#111827}
/* 表格 */
.panel{background:#fff;border:1px solid #e1e8f0;border-radius:18px;margin-bottom:18px;overflow:hidden;box-shadow:0 10px 24px rgba(80,110,140,.05)}
.panel-head{min-height:64px;display:flex;justify-content:space-between;align-items:center;padding:0 20px;border-bottom:1px solid #e6edf5}
.panel-head h3{font-size:22px;color:#172033}
.panel-body{padding:0;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:16px;text-align:left;border-bottom:1px solid #e5edf5;color:#52647c;white-space:nowrap}
th{color:#697d96;font-weight:800;background:#fafbfe}
tr:hover td{background:#fbfdff}
.mono{font-family:monospace}
.badge{display:inline-block;padding:4px 9px;border-radius:999px;font-size:12px;font-weight:800;background:#eef4fb;color:#5b6f87}
.badge.good{background:#e8f8ef;color:#11894d}
.badge.warn{background:#fff5d9;color:#a26c00}
.badge.bad{background:#fdecec;color:#d14343}
.muted-text{color:var(--muted);text-align:center;padding:24px}
.muted{color:var(--muted);font-size:12px}
.domain-log-table{table-layout:fixed;min-width:1310px}
.domain-log-table th,.domain-log-table td{padding:12px 14px;vertical-align:top}
.domain-log-table th:nth-child(1){width:48px}
.domain-log-table th:nth-child(2){width:170px}
.domain-log-table th:nth-child(3){width:120px}
.domain-log-table th:nth-child(4){width:150px}
.domain-log-table th:nth-child(5){width:310px}
.domain-log-table th:nth-child(6){width:78px}
.domain-log-table th:nth-child(7){width:120px}
.domain-log-table th:nth-child(8){width:155px}
.domain-log-table th:nth-child(9){width:230px}
.domain-log-table .url-cell{white-space:normal;word-break:break-all;line-height:1.55;color:#31465f}
.domain-log-table .path-cell{white-space:normal;word-break:break-all}
.domain-log-table .status-cell{width:68px;text-align:center}
.domain-log-table .visit-cell{white-space:normal;line-height:1.5}
.domain-log-table .source-cell{white-space:normal;word-break:break-all;color:#71839a}
.domain-log-table .user-cell{white-space:normal;word-break:break-all;color:#31465f}
.domain-log-table a.url-link{color:#176fd6;text-decoration:none}
.domain-log-table a.url-link:hover{text-decoration:underline}
.evidence-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px}
.evidence-card{border:1px solid #e1e8f0;border-radius:14px;background:#fff;overflow:hidden}
.evidence-card-head{padding:14px 16px;border-bottom:1px solid #e6edf5}
.evidence-card-select{display:flex;align-items:center;gap:8px;margin-bottom:8px;color:#52647c;font-size:12px;font-weight:800}
.evidence-card-head strong{display:block;color:#172033;font-size:16px;margin-bottom:6px;word-break:break-all}
.evidence-meta{display:flex;gap:8px;flex-wrap:wrap;color:#697d96;font-size:12px;line-height:1.6}
.evidence-shots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px}
.evidence-shot{min-width:0}
.evidence-shot a{display:block;text-decoration:none;color:#52647c;font-size:12px;font-weight:800;margin-bottom:6px}
.evidence-shot img{width:100%;aspect-ratio:9/16;object-fit:cover;object-position:top;border:1px solid #dfe8f1;border-radius:10px;background:#f6f9fc}
.toolbar{display:flex;justify-content:space-between;align-items:center;padding:0 0 16px;gap:12px}
.toolbar input,.toolbar select{width:260px;height:42px;padding:0 12px;background:#fff;border:1px solid #d8e3ef;border-radius:14px;color:#172033;font-size:14px;outline:none}
.toolbar select{width:170px}
.toolbar input:focus,.toolbar select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(47,135,255,.12)}
.batch-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.check-cell{width:46px;text-align:center}
.check-cell input{width:18px;height:18px;accent-color:var(--primary)}
/* 弹窗 */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.46);z-index:100;align-items:center;justify-content:center;padding:18px}
.modal-overlay.show{display:flex}
.modal{background:#fff;border:1px solid #dfe8f1;border-radius:18px;width:560px;max-width:94vw;max-height:86vh;overflow-y:auto;box-shadow:0 24px 80px rgba(30,55,84,.22)}
.modal header{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid #e6edf5}
.modal header h3{font-size:20px}
.modal header button{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer}
.modal .body{padding:20px}
.modal footer{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid #e6edf5}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid label{display:block;font-size:14px;color:var(--muted);font-weight:700;margin-bottom:4px}
.form-grid input,.form-grid select,.form-grid textarea{width:100%;min-height:40px;padding:0 12px;margin-top:7px;background:#fff;border:1px solid #d8e3ef;border-radius:14px;color:#172033;font-size:14px;outline:none}
.form-grid textarea{padding:10px 12px}
.form-grid input:focus,.form-grid select:focus,.form-grid textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(47,135,255,.12)}
.form-grid .full{grid-column:1/-1}
.settings-section{padding:18px 20px;border-bottom:1px solid #edf2f7}
.settings-section:last-child{border-bottom:0}
.settings-section h4{font-size:17px;color:#172033;margin-bottom:12px}
.settings-section .form-grid{gap:16px 18px}
.settings-help{color:#697d96;font-size:13px;line-height:1.7;margin:-4px 0 14px}
/* toast */
.toast-container{position:fixed;top:20px;right:20px;z-index:200}
.toast{background:#fff;border:1px solid #dfe8f1;padding:10px 18px;border-radius:14px;margin-bottom:8px;font-size:14px;box-shadow:0 12px 28px rgba(80,110,140,.14);animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:1100px){.app.show{grid-template-columns:150px minmax(0,1fr)}.sidebar .logo{justify-content:center;padding:0}.sidebar .logo strong{display:none}.sidebar nav::before{display:none}.sidebar nav button{justify-content:center;padding:0}.sidebar nav button span{font-size:15px}.sidebar .user-box{display:none}.grid-2{grid-template-columns:1fr}.panel-head{gap:12px;flex-wrap:wrap;padding:14px 18px}.toolbar{align-items:flex-start;flex-wrap:wrap}.batch-actions{justify-content:flex-start}}
@media(max-width:760px){body{overflow-x:hidden}.login-page{align-items:flex-start;padding:18px 12px}.login-box{width:100%;padding:24px 18px;border-radius:16px}.app.show{display:block}.sidebar{position:sticky;top:0;z-index:20;height:auto;display:block;border-right:0;border-bottom:1px solid #dde9f5;box-shadow:0 8px 18px rgba(35,84,125,.08)}.sidebar .logo{display:none}.sidebar nav{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;padding:10px;-webkit-overflow-scrolling:touch}.sidebar nav button{width:auto;min-width:82px;flex:0 0 auto;height:44px;margin:0;border-radius:12px;padding:0 14px;white-space:nowrap}.sidebar nav button span{font-size:15px}.main{max-height:none;overflow:visible;padding:0 12px 28px}.topbar{position:static;height:auto;min-height:64px;margin:0 -12px 14px;padding:12px;gap:10px;align-items:flex-start;flex-wrap:wrap}.topbar h2{font-size:20px}.topbar h2::before{display:none}.topbar .sub{font-size:12px}.topbar .actions{width:100%;display:flex;justify-content:flex-start}.topbar .actions button{margin:0}.toolbar{display:block;padding-bottom:12px}.toolbar input{width:100%;margin-bottom:10px}.batch-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.batch-actions .btn,.panel-head .btn{width:100%;min-height:40px}.kpis{grid-template-columns:1fr;gap:12px}.kpi{height:auto;min-height:88px;border-radius:14px;padding:16px}.kpi strong{font-size:26px}.panel{border-radius:14px;margin-bottom:14px}.panel-head{min-height:0;display:block;padding:14px 16px}.panel-head h3{font-size:19px;margin-bottom:10px}.panel-body{overflow-x:auto;-webkit-overflow-scrolling:touch}table{min-width:720px;font-size:14px}th,td{padding:12px}.form-grid{grid-template-columns:1fr;gap:12px}.modal-overlay{align-items:flex-end;padding:0}.modal{width:100%;max-width:none;max-height:92vh;border-radius:18px 18px 0 0}.modal header,.modal .body,.modal footer{padding-left:16px;padding-right:16px}.modal footer{display:grid;grid-template-columns:1fr 1fr}.modal footer .btn{width:100%;min-height:42px}.toast-container{left:12px;right:12px;top:12px}.toast{width:100%}}
@media(max-width:480px){.sidebar nav button{min-width:76px}.main{padding:0 10px 24px}.topbar{margin:0 -10px 12px;padding:10px}.batch-actions{grid-template-columns:1fr}.btn{width:100%;min-height:40px}.panel-head>div{width:100%}.panel-head>div .btn{margin-top:8px}.login-box h1{font-size:22px}.form-grid input,.form-grid select,.form-grid textarea,.login-box input{min-height:44px}.check-cell{width:38px}table{min-width:680px}}
</style>
</head>
<body>

<!-- 登录页 -->
<div id="loginPage" class="login-page">
  <div class="login-box">
    <h1>DNS 管理系统</h1>
    <p>二级域名分发出租管理后台</p>
    <label>账号<input id="loginUser" autocomplete="off" placeholder="请输入账号"></label>
    <label>密码<input id="loginPass" type="password" autocomplete="off" placeholder="请输入密码"></label>
    <button id="loginBtn">登 录</button>
    <div id="loginMsg" class="msg"></div>
    <div class="link"><a href="/">前往租户下单前台</a></div>
  </div>
</div>

<!-- 管理后台 -->
<div id="adminApp" class="app">
  <aside class="sidebar">
    <div class="logo"><span id="brandIconText">DNS</span><strong id="brandTitleText">分发出租</strong><button id="sidebarToggle" class="sidebar-toggle" type="button" title="收起侧栏">&lt;</button></div>
    <nav id="sideNav"></nav>
    <div class="user-box"><span id="userName">管理员</span><button id="logoutBtn">退出</button></div>
  </aside>
  <div class="main">
    <div class="topbar">
      <div><h2 id="pageTitle">工作台</h2><div class="sub" id="pageSub"></div></div>
      <div class="actions"><button class="btn btn-secondary" id="refreshBtn">刷新</button></div>
    </div>
    <div id="viewContent"></div>
  </div>
</div>

<!-- 弹窗 -->
<div id="modalOverlay" class="modal-overlay">
  <div class="modal">
    <header><h3 id="modalTitle">编辑</h3><button id="modalClose">&times;</button></header>
    <div class="body" id="modalBody"></div>
    <footer><button class="btn btn-secondary" id="modalCancel">取消</button><button class="btn btn-primary" id="modalSave">保存</button></footer>
  </div>
</div>

<div class="toast-container" id="toasts"></div>

<script>
// ==================== 全局状态 ====================
const S = {
  token: localStorage.getItem('dns_admin_token') || '',
  user: null,
  data: null,
  view: 'dashboard',
  filter: '',
  path: '/',
  pathFilters: {domain:'', user:'', status:''},
  logPage: 1,
  sidebarCollapsed: localStorage.getItem('dns_sidebar_collapsed') === '1'
};

const VIEWS = [
  ['dashboard','工作台','关键指标与平台状态'],
  ['accounts','平台账号','云平台API授权管理'],
  ['domains','域名池','域名聚合与价格管理'],
  ['records','解析出租','二级域名记录与租户'],
  ['orders','支付订单','订单与手动补单'],
  ['tenantUsers','用户管理','注册用户与账号状态'],
  ['userNotices','用户通知','发布前台用户公告与消息'],
  ['users','权限日志','角色用户与审计日志'],
  ['settings','系统设置','同步周期与易支付参数']
];

// ==================== 工具函数 ====================
function $(s,r){return(r||document).querySelector(s)}
function $$(s,r){return Array.from((r||document).querySelectorAll(s))}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){return '¥'+Number(n||0).toFixed(2)}
function parseDate(v){const d=v?new Date(String(v).replace(' ','T')):null;return d&&Number.isFinite(d.getTime())?d:null}
function paidAt(o){return parseDate(o.paidAt||o.paid_at||o.createdAt||o.created_at)}
function paidRevenue(days){
  const stats=S.data.dashboardStats||{};
  const statKey=days===1?'revenueToday':(days===7?'revenue7Days':(days===30?'revenue30Days':(!days?'revenueTotal':'')));
  if(statKey&&stats[statKey]!==undefined&&stats[statKey]!==null) return Number(stats[statKey]||0);
  const paid=(S.data.orders||[]).filter(o=>o.status==='paid');
  if(!days) return paid.reduce((s,o)=>s+Number(o.amount||0),0);
  const start=new Date();start.setHours(0,0,0,0);start.setDate(start.getDate()-days+1);
  return paid.filter(o=>{const d=paidAt(o);return d&&d>=start;}).reduce((s,o)=>s+Number(o.amount||0),0);
}
function pName(p){return{aliyun:'阿里云',tencent:'腾讯云'}[p]||p}
function platformOptions(){
  return [['aliyun','阿里云DNS'],['tencent','腾讯云DNSPod']];
}
function dnsRecordOptions(){
  return [['A','A'],['AAAA','AAAA'],['CNAME','CNAME'],['MX','MX'],['TXT','TXT'],['NS','NS'],['SRV','SRV'],['CAA','CAA']];
}
function badge(text,cls){return '<span class="badge '+(cls||'')+'">'+esc(text)+'</span>'}
function toast(msg){const d=document.createElement('div');d.className='toast';d.textContent=msg;$('#toasts').appendChild(d);setTimeout(()=>d.remove(),3000)}

// API 请求 - 带完善的错误处理
async function api(path, opts={}){
  const headers = {'Content-Type':'application/json'};
  if(S.token && !path.includes('/api/login')) headers['Authorization'] = 'Bearer '+S.token;
  const request = async target => {
    const r = await fetch(target, {...opts, headers:{...headers,...(opts.headers||{})}});
    const text = await r.text();
    let data;
    try{ data = JSON.parse(text); }
    catch(e){
      const err = new Error('服务器返回非JSON: '+text.substring(0,100));
      err.status = r.status;
      err.nonJson = true;
      throw err;
    }
    if(!r.ok){
      const err = new Error(data.error||('错误 '+r.status));
      err.status = r.status;
      throw err;
    }
    return data;
  };
  try{
    return await request(path);
  }catch(e){
    if((e.status===404||e.nonJson) && path.startsWith('/api/')){
      return request('/api.php?route='+encodeURIComponent(path));
    }
    if(e.message.includes('Failed to fetch')) throw new Error('网络错误，请检查服务器');
    throw e;
  }
}

// ==================== 登录 ====================
async function doLogin(){
  const username = $('#loginUser').value.trim();
  const password = $('#loginPass').value;
  const msgEl = $('#loginMsg');
  msgEl.textContent = '';
  
  // 前端校验
  if(!username){ msgEl.textContent='请输入账号'; $('#loginUser').focus(); return; }
  if(!password){ msgEl.textContent='请输入密码'; $('#loginPass').focus(); return; }
  if(username.length<2||username.length>50){ msgEl.textContent='账号长度2-50个字符'; return; }
  if(password.length<4||password.length>100){ msgEl.textContent='密码长度4-100个字符'; return; }
  if(!/^[a-zA-Z0-9_\u4e00-\u9fa5]+$/.test(username)){ msgEl.textContent='账号只能包含字母、数字、下划线和中文'; return; }
  
  // 禁用按钮防止重复提交
  const btn = $('#loginBtn');
  btn.disabled = true;
  btn.textContent = '登录中...';
  
  try{
    const data = await api('/api/login',{method:'POST',body:JSON.stringify({username,password})});
    S.token = data.token;
    S.user = data.user;
    localStorage.setItem('dns_admin_token', data.token);
    showAdmin();
    loadData();
  }catch(e){
    msgEl.textContent = e.message;
  }finally{
    btn.disabled = false;
    btn.textContent = '登 录';
  }
}

function showLogin(){
  $('#loginPage').style.display = 'flex';
  $('#adminApp').classList.remove('show');
}

function showAdmin(){
  $('#loginPage').style.display = 'none';
  $('#adminApp').classList.add('show');
  $('#adminApp').classList.toggle('sidebar-collapsed', S.sidebarCollapsed);
  if($('#sidebarToggle')){
    $('#sidebarToggle').title = S.sidebarCollapsed ? '展开侧栏' : '收起侧栏';
    $('#sidebarToggle').textContent = S.sidebarCollapsed ? '>' : '<';
  }
  if(S.user) $('#userName').textContent = S.user.name||S.user.username;
  renderNav();
  renderView();
}

function doLogout(){
  // 调用后端登出接口
  if(S.token){
    api('/api/logout',{method:'POST',body:'{}'}).catch(()=>{});
  }
  S.token=''; S.user=null; S.data=null;
  localStorage.removeItem('dns_admin_token');
  showLogin();
}

// ==================== 数据加载 ====================
async function loadData(silent){
  try{
    S.data = await api('/api/bootstrap');
    applyBrandSettings();
    renderView();
  }catch(e){
    if(e.message.includes('401')||e.message.includes('未登录')||e.message.includes('请先登录')){
      S.token=''; S.user=null; S.data=null;
      localStorage.removeItem('dns_admin_token');
      showLogin();
      if(!silent) toast('登录已过期，请重新登录');
    }else{
      toast('加载数据失败: '+e.message);
    }
  }
}

function applyBrandSettings(){
  const s=S.data?.settings||{};
  const iconText=String(s.adminLogoText??s.admin_logo_text??'DNS').trim()||'DNS';
  const titleText=String(s.adminBrandName??s.admin_brand_name??'分发出租').trim()||'分发出租';
  const systemName=String(s.systemName??s.system_name??'DNS二级域名管理系统').trim()||'DNS二级域名管理系统';
  const iconEl=$('#brandIconText');
  const titleEl=$('#brandTitleText');
  if(iconEl) iconEl.textContent=iconText;
  if(titleEl) titleEl.textContent=titleText;

}

// ==================== 导航 ====================

}

function noticeStatusText(status){
  return status==='inactive'?'已下架':'已发布';
}

function saveUserNotices(notices){
  return api('/api/settings',{method:'PATCH',body:JSON.stringify({userNotices:notices})}).then(()=>loadData());
}

function noticeFormFields(n){
  return formFields([
    {label:'通知标题',name:'title',value:n?.title||'',full:true},
    {label:'通知类型',name:'level',type:'select',value:n?.level||'info',options:[['info','通知'],['success','公告'],['warning','提醒'],['danger','重要']]},
    {label:'状态',name:'status',type:'select',value:n?.status||'active',options:[['active','发布'],['inactive','下架']]},
    {label:'通知内容',name:'body',type:'textarea',value:n?.body||'',placeholder:'填写要展示给用户的消息内容',full:true}
  ]);
}

function openNoticeModal(notice){
  openModal(notice?'编辑用户通知':'发布用户通知',noticeFormFields(notice),data=>{
    const notices=Array.isArray(S.data.settings?.userNotices)?[...S.data.settings.userNotices]:[];
    const now=new Date().toISOString().slice(0,19).replace('T',' ');
    const title=String(data.title||'').trim();
    const body=String(data.body||'').trim();
    if(!title) throw new Error('请填写通知标题');
    if(!body) throw new Error('请填写通知内容');
    if(notice){
      const idx=notices.findIndex(n=>n.id===notice.id);
      if(idx>=0) notices[idx]={...notices[idx],title,body,level:data.level||'info',status:data.status||'active',updatedAt:now};
    }else{
      notices.unshift({id:'nt'+Date.now()+Math.floor(Math.random()*1000),title,body,level:data.level||'info',status:data.status||'active',createdAt:now,updatedAt:now});
    }
    return saveUserNotices(notices);
  });
}

// ==================== 弹窗 ====================
function openModal(title, html, action){
  $('#modalTitle').textContent=title;
  $('#modalBody').innerHTML=html;
  _modalAction=action||null;
  $('#modalOverlay').classList.add('show');
}
function closeModal(){$('#modalOverlay').classList.remove('show')}

function formFields(fields){
  return '<div class="form-grid">'+fields.map(f=>{
    const cls=f.full?' class="full"':'';
    let input;
    if(f.type==='select') input='<select name="'+f.name+'">'+f.options.map(o=>'<option value="'+esc(o[0])+'"'+(String(f.value)===String(o[0])?' selected':'')+'>'+esc(o[1])+'</option>').join('')+'</select>';
    else if(f.type==='textarea') input='<textarea name="'+f.name+'" placeholder="'+esc(f.placeholder||'')+'">'+esc(f.value||'')+'</textarea>';
    else input='<input name="'+f.name+'" type="'+(f.type||'text')+'" value="'+esc(f.value||'')+'" placeholder="'+esc(f.placeholder||'')+'">';
    return '<label'+cls+'>'+f.label+input+'</label>';
  }).join('')+'</div>';
}

function getFormData(){
  const data={};
  $$('#modalBody input, #modalBody select, #modalBody textarea').forEach(el=>{
    data[el.name]=el.type==='number'?Number(el.value):el.value;
  });
  return data;
}

async function batchOperate(kind, action){
  const selector = kind === 'domain' ? '.js-domain-check:checked' : '.js-record-check:checked';
  const ids = $$(selector).map(item=>item.value).filter(Boolean);
  if(!ids.length){toast('请先勾选要操作的数据');return;}
  const label = kind === 'domain' ? '域名' : '解析记录';
  const actionText = action === 'enable' ? '开启' : (action === 'pause' ? '暂停' : '删除');
  if(!confirm('确定批量'+actionText+'选中的 '+ids.length+' 条'+label+'？')) return;
  try{
    for(const id of ids){
      if(kind === 'domain'){
        if(action === 'enable') await api('/api/domains/'+id,{method:'PATCH',body:JSON.stringify({status:'active'})});
        else if(action === 'pause') await api('/api/domains/'+id,{method:'PATCH',body:JSON.stringify({status:'paused'})});
        else await api('/api/domains/'+id,{method:'DELETE'});
      }else{
        if(action === 'pause') await api('/api/records/'+id,{method:'PATCH',body:JSON.stringify({status:'paused'})});
        else await api('/api/records/'+id,{method:'DELETE'});
      }
    }
    await loadData(true);
    toast('批量'+actionText+'完成');
  }catch(e){
    toast('批量操作失败: '+e.message);
    loadData(true);
  }
}

async function batchGroupDomains(){
  const ids = $$('.js-domain-check:checked').map(item=>item.value).filter(Boolean);
  if(!ids.length){toast('请先勾选要分组的域名');return;}
  const groupName = prompt('请输入新的分组名称');
  if(groupName === null) return;
  const group = groupName.trim();
  if(!group){toast('分组名称不能为空');return;}
  try{
    for(const id of ids){
      await api('/api/domains/'+id,{method:'PATCH',body:JSON.stringify({group})});
    }
    await loadData(true);
    toast('批量分组完成');
  }catch(e){
    toast('批量分组失败: '+e.message);
    loadData(true);
  }
}
